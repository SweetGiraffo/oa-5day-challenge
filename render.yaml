databases:
  - name: oa-challenge-db
    databaseName: oachallenge
    user: oachallenge
    plan: free

services:
  - type: web
    name: oa-challenge-arena
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: oa-challenge-db
          property: connectionString
      - key: NODE_ENV
        value: production
